[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-eng-workbench"
version = "0.1.0"
description = "Describe legal work, generate reusable skills, rehearse and release host packages"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.scripts]
legal-workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.setuptools.package-data]
workbench = ["resources/*"]
